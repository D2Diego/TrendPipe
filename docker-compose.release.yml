services:
  api:
    image: ghcr.io/d2diego/trendpipe:latest
    container_name: "trendpipe-api"
    ports:
      - "127.0.0.1:8080:8080"
    command: [ "python3", "main.py" ]
    volumes:
      - ./config.toml:/TrendPipe/config.toml
      - ./storage:/TrendPipe/storage
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/docs', timeout=3)" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: always
