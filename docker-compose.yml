services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: "trendpipe-api"
    ports:
      - "127.0.0.1:8080:8080"
    command: [ "python3", "main.py" ]
    volumes:
      - ./:/TrendPipe
      # The bind mount above shadows the whole repo, including the built
      # React app the Dockerfile copies into resource/public. Pin that one
      # path to an anonymous volume so the image's build wins there instead
      # of the (unbuilt, placeholder) copy tracked in git on the host.
      - /TrendPipe/resource/public
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/docs', timeout=3)" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: always
